name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.4
          python-version: "3.13"
      - run: npm install --global npm@11.7.0
      - run: npm ci
      - run: uv sync --directory services/api --all-groups --frozen
      - run: npm run check:core
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --workers=1
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
